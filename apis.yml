aid: ansa
name: Ansa
description: >-
  Ansa is a stored-value platform that lets businesses launch branded digital
  wallets — closed-loop balances, incentives, and loyalty — to turn payments
  into a revenue and retention driver. Its REST API and mobile SDKs (AnsaCore
  and AnsaUI for iOS, Android, and React Native) cover customers, payment
  methods, wallet funding, transactions, refunds, customer segments, incentive
  campaigns, promotional accounts, virtual cards, settlements, and webhooks.
  Authentication is via environment-scoped API keys with idempotency and
  cursor pagination. Ansa is backed by Bain Capital Ventures and targets
  marketplaces, platform businesses, and quick-service restaurants.
