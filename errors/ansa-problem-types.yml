    title: Bad Request
    remediation: Fix missing/invalid parameters or request body.
  - status: 401
    title: Unauthorized
    remediation: Provide a valid API key in the Authorization header.
  - status: 402
    title: Payment Failed
    remediation: Parameters valid but the request failed (e.g. add-balance). Inspect error.code / declineCode.
  - status: 403
    title: Forbidden
    remediation: API key lacks permission for this operation (check merchant vs client scope).
  - status: 409
    title: Conflict
    remediation: Often a reused idempotency key; use a fresh Ansa-Idempotency-Key or reconcile the prior result.
  - status: 429
    title: Too Many Requests
    remediation: Apply exponential backoff.
