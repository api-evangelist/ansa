notes: >-
  Decline codes map to errors returned by the Payment Service Provider (PSP)
  and are surfaced on the error object's declineCode field for card declines.
  Ansa guidance: never return the raw decline code to the buyer (especially for
  fraud); display the user-friendly message instead.
