openapi: 3.1.0
info:
  title: Ansa Add Incentive Transactions API
  version: '1'
  description: Ansa stored-value wallet platform API. Reconstructed by API Evangelist from the per-operation OpenAPI 3.1 definitions embedded in the Ansa ReadMe documentation (docs.ansa.dev/reference).
servers:
- url: https://api.getansa.com
  description: Live
- url: https://api-sandbox.getansa.com
  description: Sandbox
security:
- sec0: []
tags:
- name: Transactions
paths:
  /v1/transactions/{transactionId}/refunds:
    get:
      description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        additionalInfo:
                          type: object
                          properties: {}
                        label:
                          type: string
                          example: ''
                        metadata:
                          type: object
                          properties: {}
                        timestamp:
                          type: string
                          example: '2026-03-15T12:34:56.789Z'
                        transactionId:
                          type: string
                          example: a2b3c4d5-e6f7-8901-2345-6789abcdef01
                        amount:
                          type: integer
                          example: 15400
                          default: 0
                        created:
                          type: string
                          example: '2026-03-15T12:34:56.789Z'
                        currency:
                          type: string
                          example: USD
                        customerId:
                          type: string
                          example: 12345678-90ab-cdef-1234-567890abcdef
                        from:
                          type: string
                          example: abcdef12-3456-7890-abcd-ef1234567890
                        fromAccountId:
                          type: string
                          example: fedcba98-7654-3210-fedc-ba9876543210
                        fromAccountReferenceId:
                          type: string
                          example: default
                        reason:
                          type: string
                          example: ''
                        to:
                          type: string
                          example: 12345678-90ab-cdef-1234-567890abcdef
                        toAccountId:
                          type: string
                          example: 01234567-89ab-cdef-0123-456789abcdef
                        toAccountReferenceId:
                          type: string
                          example: default
                        transactionType:
                          type: string
                          example: merchant_refund
                        transactionTypeDisplayName:
                          type: string
                          example: Refund to Balance
              examples:
                OK:
                  summary: OK
                  value:
                    transactions:
                    - additionalInfo: null
                      label: ''
                      metadata: null
                      timestamp: '2026-03-15T12:34:56.789Z'
                      transactionId: a2b3c4d5-e6f7-8901-2345-6789abcdef01
                      amount: 15400
                      created: '2026-03-15T12:34:56.789Z'
                      currency: USD
                      customerId: 12345678-90ab-cdef-1234-567890abcdef
                      from: abcdef12-3456-7890-abcd-ef1234567890
                      fromAccountId: fedcba98-7654-3210-fedc-ba9876543210
                      fromAccountReferenceId: default
                      reason: ''
                      to: 12345678-90ab-cdef-1234-567890abcdef
                      toAccountId: 01234567-89ab-cdef-0123-456789abcdef
                      toAccountReferenceId: default
                      transactionType: merchant_refund
                      transactionTypeDisplayName: Refund to Balance
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: internal
                  message:
                    type: string
                    example: Something went wrong. Please try again later.
                  type:
                    type: string
                    example: api_error
              examples:
                Internal Server Error:
                  summary: Internal Server Error
                  value:
                    code: internal
                    message: Something went wrong. Please try again later.
                    type: api_error
          description: Internal Server Error
      parameters:
      - in: path
        name: transactionId
        schema:
          type: string
        required: true
      operationId: get_v1-transactions-transactionid-refunds
      tags:
      - Transactions
  /v1/transactions:
