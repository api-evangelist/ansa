  /v1/transactions/{transactionId}/metadata:
    put:
      summary: Update transaction metadata
      description: ''
      operationId: update-transaction-metadata
      parameters:
      - name: transactionId
        in: path
        description: The id of the transaction
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: A string identifier that can be attached to this transaction id.
                metadata:
                  type: object
                  description: Set of `string` key-value pairs that you can attach to a transaction. This value will completely overwrite existing metadata.
                  properties: {}
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Success:
                  value: "{\n  \"amount\": 500,\n  \"created\": \"2023-08-07T22:23:35.107Z\",\n  \"from\": \"76db3d73-c8ae-45f9-b04f-5383e4eae90e\",\n  \"label\": \"my-new-transaction-label\",\n  \"metadata\": {\n    \"sampleKey\": \"anUpdatedMetadataValue\",\n    \"storeLocationId\": \"location-123abc\",\n    \"storeLocationName\": \"name-123abc\"\n  },\n  \"to\": \"bcb745a4-10c4-40a1-8911-8730d233b134\",\n  \"transactionId\": \"b9d996ee-242a-4a6f-9a34-8b725c882663\",\n  \"transactionSource\": \"useBalance\",\n  \"transactionType\": \"use_balance\"\n}"
              schema:
