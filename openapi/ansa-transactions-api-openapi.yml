      - name: cursor
        in: query
        description: A cursor returned from a previous request to fetch the next or previous page.
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          default: '50'
        description: 'Number of transactions to return in a single page of results. Max: 50'
      - in: query
        name: transactionType
        schema:
          type: string
        description: Filter by transaction type.
      - in: query
        name: label
        schema:
          type: string
        description: Filter by transaction label.
      - in: query
        name: labelContains
