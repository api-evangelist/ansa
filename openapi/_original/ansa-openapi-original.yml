  /v1/customers/{customerId}/payment-methods:
    post:
      summary: Create payment method from token
      description: ''
      operationId: create-payment-method
      parameters:
      - name: customerId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - tokenSource
              properties:
                token:
                  type: string
                  description: The token referencing the customer's payment method information.
                tokenSource:
                  type: string
                  description: Enum describing the source of the token.
                  enum:
                  - credit_card
                  - stripe
                  - google_pay
                  - apple_pay
                  - plaid
                  - bank_account
                  - software_only
                tokenData:
                  type: string
                  description: Payment token object used for `apple_pay` and `google_pay`.
                  format: json
                metadata:
                  type: string
                  description: JSON object of string key-value pairs that you can attach to the created
                    payment method.
                  format: json
                postalCode:
                  type: string
                  description: The billing postal code.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Credit Card:
                  value: "{\n\t\t  \"card\": {\n\t\t\t\t\"brand\": \"visa\",\n\t\t\t\t\"fingerprint\"\
                    : \"54B7LhtQWFV5vmCRrF2zkWNNfhPtEYfJPG795vaNaAk1\",\n\t\t\t\t\"lastFour\":\"4242\"\
                    \n\t\t\t},\n\t\t  \"id\": \"2865a348-d701-4fc5-a925-e7041cb0ebd5\",\n      \"type\"\
                    : \"credit_card\",\n\t\t\t\"preferred\": true\n}"
                Bank Account:
                  value: "{\n    \"bank\": {\n        \"accountNumberLast4\": \"1232\",\n        \"name\"\
                    : \"Discover\",\n        \"routingNumber\": \"042100122\"\n    },\n    \"id\": \"\
                    e846b122-5bb2-436e-222e-0053d54c8111\",\n    \"type\": \"bank_account\"\n}"
              schema:
                oneOf:
                - title: Credit Card
                  type: object
                  properties:
                    card:
                      type: object
                      properties:
                        brand:
                          type: string
                          example: visa
                        fingerprint:
                          type: string
                          example: 54B7LhtQWFV5vmCRrF2zkWNNfhPtEYfJPG795vaNaAk1
                        lastFour:
                          type: string
                          example: '4242'
                    id:
                      type: string
                      example: 2865a348-d701-4fc5-a925-e7041cb0ebd5
                    type:
                      type: string
                      example: credit_card
                    preferred:
                      type: boolean
                      example: true
                      default: true
                - title: Bank Account
                  type: object
                  properties:
                    bank:
                      type: object
                      properties:
                        accountNumberLast4:
                          type: string
                          example: '1232'
                        name:
                          type: string
                          example: Discover
                        routingNumber:
                          type: string
                          example: '042100122'
                    id:
                      type: string
                      example: e846b122-5bb2-436e-222e-0053d54c8111
                    type:
                      type: string
                      example: bank_account
