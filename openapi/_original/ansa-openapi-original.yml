  /v1/merchants/{merchantId}/campaigns:
    post:
      summary: Create campaign
      description: ''
      operationId: create-incentive
      parameters:
      - name: merchantId
        in: path
        description: The ID of the merchant. You will receive this constant value during onboarding.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - type
              - settings
              properties:
                name:
                  type: string
                  description: The name of the campaign. The campaign name is not visible to end users
                type:
                  type: string
                  description: The type of incentive campaign to create
                  enum:
                  - cashback
                  - reloadBonus
                  - promoCode
                  - drop
                  - userCreationBonus
                settings:
                  type: object
                  description: Shared campaign settings
                  required:
                  - startAt
                  - targetSegments
                  properties:
                    startAt:
                      type: string
                      description: When the campaign will start being active.
                      format: date-time
                    endAt:
                      type: string
                      description: When the campaign will stop being effective.
                      format: date-time
                    targetSegments:
                      type: array
                      description: List of segment UUIDs that will be eligible for the campaign.
                      items:
                        type: string
                    expirationMetadata:
                      type: object
                      description: Configuration for the expiration of funds
                      properties:
                        type:
                          type: string
                          description: Type specifies the expiration strategy for promotions granted by
                            this campaign.
                          enum:
                          - xDaysAfterRedeeming
                        xDaysAfterRedeeming:
                          type: object
                          properties:
                            numberOfDays:
                              type: integer
                              description: Number of days after redemption before the funds expire.
                              format: int32
                cashback:
                  type: object
                  description: Cash back configuration object
                  required:
                  - percentCashback
                  properties:
                    percentCashback:
                      type: integer
                      description: Cash back a user will receive as a percentage of use balance.
                      format: int32
                reloadBonus:
                  type: object
                  description: Reload bonus configurations
                  properties:
                    type:
                      type: string
                      description: Type of reload bonus campaign affecting the number of times a single
                        user can receive bonuses from this reload bonus campaign
                      enum:
                      - oncePerCampaign
                      - unlimited
                    rewardTiers:
                      type: array
                      description: Configuration object for the reload bonus reward tiers
                      items:
                        properties:
                          minAmount:
                            type: integer
                            description: Fund amount required to trigger this reward tier
                            format: int32
                          promoAmount:
                            type: integer
                            description: Promotion amount given to the customer
                            format: int32
                        type: object
                promoCode:
                  type: object
                  description: Promo code configurations
                  required:
                  - code
                  - amount
                  properties:
                    code:
                      type: string
                      description: The code that user's will enter to redeem the code. Case insensitive,
                        stored in uppercase.
                    amount:
                      type: integer
                      description: The credit amount that the user receives when this promo code is redeemed.
                        The integer amount is in the lowest denomination of the merchant currency code.
                      format: int32
                drop:
                  type: object
                  description: Drop configurations
                  required:
                  - amount
                  properties:
                    amount:
                      type: integer
                      description: The credit amount that the user receives when this promo code is redeemed.
                        The integer amount is in the lowest denomination of the merchant currency code.
                      format: int32
                userCreationBonus:
                  type: object
                  properties:
                    amount:
                      type: integer
                      description: Incentive amount given to the customer
                  description: User creation bonus configurations
                  required:
                  - amount
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Reload Bonus Campaign:
                  value: "{\n    \"id\": \"9bbbf5cf-41fe-4057-a8cf-a94e379854a6\",\n    \"name\": \"test-campaign\"\
                    ,\n    \"reloadBonus\": {\n        \"rewardTiers\": [\n            {\n           \
                    \     \"minAmount\": 100,\n                \"promoAmount\": 100\n            }\n \
                    \       ],\n        \"type\": \"unlimited\"\n    },\n    \"settings\": {\n       \
                    \ \"endAt\": \"2026-09-20T20:34:07.000Z\",\n        \"expirationMetadata\": {\n  \
                    \          \"type\": \"xDaysAfterRedeeming\",\n            \"xDaysAfterRedeeming\"\
                    : {\n                \"numDays\": 1\n            }\n        },\n        \"startAt\"\
                    : \"2022-09-20T20:34:07.000Z\",\n        \"targetSegments\": [\n            {\n  \
                    \              \"id\": \"28f7082f-d040-4eb3-b008-12e6319c4783\",\n               \
                    \ \"name\": \"All Customers\"\n            }\n        ]\n    },\n    \"type\": \"\
                    reloadBonus\"\n}"
                Cashback Campaign:
                  value: "{\n    \"cashback\": {\n        \"percentCashback\": 10\n    },\n    \"id\"\
                    : \"d0ad2310-eed2-4847-ae92-3720613dd3a4\",\n    \"name\": \"test-campaign\",\n  \
