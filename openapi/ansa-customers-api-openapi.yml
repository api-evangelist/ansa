                amount:
                  type: integer
                  description: The amount of the customer's purchase.
                  format: int32
                currency:
                  type: string
                  description: Three-letter ISO currency code.
                label:
                  type: string
                  description: A string reference that can be attached to this transaction for future discoverability.
                metadata:
                  type: string
                  description: JSON object of string key-value pairs that you can attach to the created transaction.
                  format: json
                additionalInfo:
                  type: object
                  description: Additional structured information about this transaction. Does not impact transaction behavior.
                  properties:
                    storeId:
                      type: string
                      description: An id for the store this transaction occurred at. This value is used in reporting.
                    storeName:
                      type: string
                      description: The name of the store this transaction occurred at. This value is used in reporting.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Success:
                  value: "{\n    \"additionalInfo\": null,\n    \"label\": \"example-label\",\n    \"metadata\": null,\n    \"timestamp\": \"2025-05-02T21:24:47.382Z\",\n    \"transactionId\": \"1609359e-de76-4c49-becb-887870031a87\",\n    \"currentBalance\": {\n        \"amount\": 2600,\n        \"currency\": \"USD\"\n    }\n}"
              schema:
                type: object
                properties:
                  additionalInfo: {}
                  label:
                    type: string
                    example: example-label
                  metadata: {}
                  timestamp:
                    type: string
                    example: '2025-05-02T21:24:47.382Z'
                  transactionId:
                    type: string
                    example: 1609359e-de76-4c49-becb-887870031a87
                  currentBalance:
                    type: object
                    properties:
                      amount:
                        type: integer
                        example: 2600
                        default: 0
                      currency:
                        type: string
                        example: USD
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Bad Request:
                  value: "{\n    \"code\": \"invalid_amount\",\n    \"message\": \"The provided amount is invalid.\",\n    \"type\": \"invalid_request_error\"\n}"
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: invalid_amount
                  message:
                    type: string
                    example: The provided amount is invalid.
                  type:
                    type: string
                    example: invalid_request_error
        '500':
          description: '500'
          content:
            application/json:
              examples:
                Internal Error:
                  value: "{\n  \"code\": \"internal\",\n  \"message\": \"Something went wrong. Please try again later.\",\n  \"type\": \"api_error\"\n}"
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: internal
                  message:
                    type: string
                    example: Something went wrong. Please try again later.
                  type:
                    type: string
                    example: api_error
      deprecated: false
      tags:
      - Customers
components:
  securitySchemes:
    sec0:
      type: apiKey
      name: Authorization
